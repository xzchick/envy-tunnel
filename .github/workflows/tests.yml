name: Cross-platform build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libxkbcommon0 libgl1 >/dev/null
      - name: Install the app and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller build
      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Build the standalone bundle, wheel, sdist, and checksums
        run: python scripts/build_release_bundle.py
      - name: Smoke test the standalone bundle
        run: python scripts/smoke_test_release.py
      - name: Upload bundle and checksums
        uses: actions/upload-artifact@v4
        with:
          name: envy-tunnel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            dist/envy-tunnel-v*.tar.gz
            dist/envy-tunnel-v*.zip
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error

  wireguard-e2e:
    # A real WireGuard server + client on a throwaway VM, driven by ENVY's own scripts.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install WireGuard tools and the app
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools iptables curl >/dev/null
          python -m pip install --upgrade pip
          python -m pip install .
      - name: End-to-end tunnel test
        run: python scripts/e2e_wireguard.py
